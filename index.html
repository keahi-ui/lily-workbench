<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7bc99e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="lilyの工作台">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <title>lilyの工作台</title>
</head>
<body>
  <!-- 登录门禁 -->
  <div id="login-overlay">
    <div class="login-card">
      <h1>🌟 lilyの工作台</h1>
      <p class="login-sub">请输入密码访问</p>
      <div class="login-input-row">
        <input type="password" id="login-pwd" placeholder="输入密码" autocomplete="off" maxlength="32">
      </div>
      <button id="login-btn">进入工作台</button>
      <p id="login-error" class="login-error"></p>
      <a href="javascript:void(0)" id="login-reset" class="login-reset">忘记密码？重置为默认密码</a>
    </div>
  </div>

  <div id="app">
    <button id="menu-toggle" aria-label="菜单">☰</button>
    <div id="sidebar-overlay"></div>
    <aside id="sidebar"></aside>
    <main id="content">
      <div class="loading-screen">
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
        <p>正在加载工作台...</p>
      </div>
    </main>
  </div>
  <div id="modal-container"></div>
  <div id="toast-container"></div>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
